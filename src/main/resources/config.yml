database:
  host: localhost
  port: 3306
  name: life_userdata
  username: life_userdata
  password: life_userdata
  # テーブル名の接頭辞 (azirank_playtime, azirank_rankup_log が作成される)
  table-prefix: azirank_
  pool-size: 4
  properties: {}

# オンラインプレイヤーのプレイ時間をDBへ書き込む間隔 (秒)
flush-interval-seconds: 60
# ランクアップの動作
#   run:     コマンドを実行してランクアップする
#   dry-run: 条件を満たした人をログに出すだけ (Autorank と並行稼働中はこれ)
#   off:     チェックしない
rankup-mode: dry-run
# ランクアップ条件をチェックする間隔 (秒)
check-interval-seconds: 60
# ランクアップコマンド実行後、LuckPermsのグループが反映されるまで再実行しない時間 (秒)
rankup-pending-seconds: 300
# ランクのグループを1つも持っていないプレイヤーを最初のランク扱いにするか
treat-no-rank-as-first: true
# rank グループの LuckPerms server コンテキスト (AziPluginMessaging の rankableServers の値)
# migrate audit-ranks / apply-ranks で使う
luckperms-server: life
# /azirank top の1ページあたりの件数
leaderboard-page-size: 10
# リーダーボードのキャッシュ時間 (秒)
leaderboard-cache-seconds: 300

# LuckPerms のグループ名を低い順に並べる。現在のランクは「所持している中で一番後ろのグループ」
ranks:
  - rank1
  - rank2
  - rank3
  - rank4
  - rank5
  - rank6
  - rank7
  - rank8
  - rank9
  - rank10

# キー = 昇格先のグループ。1つ前のランクからこのランクへ上がる条件と実行コマンド。
# requirements:
#   playtime:            合計プレイ時間 (例: 1d 2h 30m / 90m / 数字のみは分)
#   mcmmo-power-level:   mcMMO のパワーレベル
#   taxoffice:           TaxOffice のポイント
# commands: コンソールから実行。%player% = プレイヤー名, %uuid% = UUID
rankups:
  rank2:
    requirements:
      mcmmo-power-level: 50
      playtime: 20m
      taxoffice: 20
    commands:
      - azipluginmessaging setrank rank2 %player%
      - essentials:bc &f%player% &7が &fRank2 &7になりました！
