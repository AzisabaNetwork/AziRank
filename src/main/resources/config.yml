# MiniMessage 形式
messages:
  check-header: "<green>----- <gold><player></gold> のランク -----"
  check-rank: "<gray>現在のランク: <white><rank>"
  check-playtime: "<gray>合計プレイ時間: <white><playtime>"
  check-next: "<gray>次のランク <white><next></white> の条件:"
  check-max: "<gold>最高ランクに到達しています！"
  requirement-line: " <status> <gray><description>: <white><current></white> / <required>"
  status-done: "<green>✔"
  status-not-done: "<red>✘"
  requirement-playtime: "プレイ時間"
  requirement-mcmmo: "mcMMO パワーレベル"
  requirement-taxoffice: "納税ポイント"
  top-header: "<green>----- プレイ時間ランキング (<page>/<pages>) -----"
  top-line: "<gold><rank>. <aqua><player> <gray>- <white><playtime>"
  player-not-found: "<red>プレイヤー <player> が見つかりません。"
  loading: "<gray>読み込み中..."
  reloaded: "<green>設定を再読み込みしました。"
  playtime-set: "<green><player> のプレイ時間を <playtime> にしました。"
  import-started: "<gray>プレイ時間の移行を開始します: <source>"
  import-done: "<green>移行完了: <count> 件 (名前補完 <names> 件)"
  audit-started: "<gray>ランクの突き合わせを開始します: <source>"
  audit-done: "<green>突き合わせ完了: <total> 人中 一致 <same> / <red>LPの方が低い <lower></red> / <yellow>LPの方が高い <higher></yellow><newline><gray>詳細: <file>"
  no-permission: "<red>権限がありません。"
  error: "<red>エラーが発生しました。コンソールを確認してください。"
